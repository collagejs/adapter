name: Test

on:
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/test.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    uses: collagejs/cicd/.github/workflows/npm-test.yml@main
    with:
      node-version: 24
      build-script: build
      test-script: test
      build: false